# Local development convenience: brings up Postgres + Redis + the bot together.
# Production is a SINGLE bot container on a web panel that already provides
# Postgres and Redis — there you build the image and run `python -m bot` with
# the right env vars (POSTGRES__HOST / REDIS__HOST pointing at the panel's
# services). The bot migrates itself on startup, so no compose is required in
# prod. See README "Deploy on a web panel".
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES__USER:-anticor}
      POSTGRES_PASSWORD: ${POSTGRES__PASSWORD:?set POSTGRES__PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES__DB:-anticor}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES__USER:-anticor}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published to the host — only reachable on the compose network.
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS__PASSWORD:?set REDIS__PASSWORD in .env}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS__PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "6379"

  bot:
    build: .
    env_file: .env
    environment:
      POSTGRES__HOST: postgres
      REDIS__HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # The bot applies migrations itself on startup (RUN_MIGRATIONS_ON_STARTUP,
    # default true), so no separate one-shot migrate job is needed — this also
    # matches the production target (a web panel that runs a single container).
    # For webhook mode put a reverse proxy (nginx/Caddy) in front and expose only
    # that. The bot binds 127.0.0.1 by default and is not published here.

volumes:
  pg-data:
  redis-data:
