services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES__USER:-anticor}
      POSTGRES_PASSWORD: ${POSTGRES__PASSWORD:?set POSTGRES__PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES__DB:-anticor}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES__USER:-anticor}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published to the host — only reachable on the compose network.
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS__PASSWORD:?set REDIS__PASSWORD in .env}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS__PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "6379"

  # One-shot migration job — runs to completion before the bot starts. Keeping
  # migrations out of the bot process avoids races when scaling replicas.
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      POSTGRES__HOST: postgres
      REDIS__HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bot:
    build: .
    env_file: .env
    environment:
      POSTGRES__HOST: postgres
      REDIS__HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # For webhook mode put a reverse proxy (nginx/Caddy) in front and expose only
    # that. The bot binds 127.0.0.1 by default and is not published here.

volumes:
  pg-data:
  redis-data:
